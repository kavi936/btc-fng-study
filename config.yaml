# BTC Fear & Greed Extreme Fear buy-signal study configuration
# Edit values here without changing logic in src/

thresholds: [12, 15]
horizons: [1, 3, 7, 14, 30, 60, 90, 180, 365]
cooldowns: [7, 14, 30]
default_cooldown: 14

# Base case: enter at open of day after F&G prints (avoids look-ahead)
entry_timing: next_open  # next_open | signal_close
sensitivity_entry_timing: signal_close

fee_per_trade: 0.001  # 0.1% per side
mae_windows: [7, 30, 90, 180]
time_to_bottom_windows: [30, 90, 180]
mfe_windows: [30, 90, 180]
local_bottom_recovery: 0.20  # +20% off low defines local bottom
fng_recovery_levels: [25, 50]
further_drawdown_levels: [0.10, 0.20, 0.30]

bootstrap_samples: 10000
bootstrap_seed: 42
ci_horizons: [30, 90, 180, 365]
low_sample_n: 10

backtest_hold_horizons: [30, 90, 180, 365]
ladder_drop_levels: [0.10, 0.20]
ladder_window_days: 90
dca_daily_amount: 1.0

# Market cycle labels (inclusive start, exclusive end except last)
cycles:
  - name: "2018_bear"
    start: "2018-02-01"
    end: "2019-01-01"
  - name: "2019_2021"
    start: "2019-01-01"
    end: "2022-01-01"
  - name: "2022_bear"
    start: "2022-01-01"
    end: "2023-01-01"
  - name: "2023_present"
    start: "2023-01-01"
    end: "2100-01-01"

fear_depth_bins:
  - name: "le_10"
    min: 0
    max: 10
  - name: "11_12"
    min: 11
    max: 12
  - name: "13_15"
    min: 13
    max: 15

sma_days: 200

paths:
  raw: data/raw
  processed: data/processed
  reports: reports

binance:
  symbol: BTCUSDT
  interval: 1d
  limit: 1000
  bases:
    - "https://data-api.binance.vision"
    - "https://api.binance.us"

alternative_me_fng: "https://api.alternative.me/fng/?limit=0&format=json"
coinglass:
  base: "https://open-api-v4.coinglass.com"
  fng_path: "/api/index/fear-greed-history"
  ohlc_path: "/api/spot/price/history"
